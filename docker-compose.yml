services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DIP_DATABASE_URL=sqlite+aiosqlite:///./dip.db
      - DIP_CORS_ORIGINS=["http://localhost:5173"]
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend

  surrealdb:
    image: surrealdb/surrealdb:latest
    command: start --user root --pass root memory
    ports:
      - "8001:8000"
