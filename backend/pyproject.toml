[project]
name = "dip-backend"
version = "0.1.0"
description = "Data Integration Platform - backend"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "surreal: tests that need a running SurrealDB process (skipped if 'surreal' binary missing)",
]
